spring.application.name=jwt-session-demo
server.port=8080

# Set these environment variables to match your local MySQL configuration.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jwt_session_demo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=true

# Demo fallback only. Replace with a strong, private environment variable in real deployments.
jwt.secret=${JWT_SECRET:ZGV2LXNlY3JldC1mb3ItZGVtby1vbmx5LWNoYW5nZS1tZS0zMi1ieXRlcyEh}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
